
name: PEP 8 validation

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pep8:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install tools
        run: python -m pip install black pycodestyle

      - name: Format code with Black
        run: black --line-length 79 .

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --quiet || git commit -m "style: format code with Black"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Check PEP 8
        run: pycodestyle --exclude=venv,.venv . --count
