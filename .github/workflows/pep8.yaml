
name: PEP 8 validation

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  pep8:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pycodestyle
        run: pip install pycodestyle

      - name: Install black
        run: pip install black

      - name: Run black
        run: black .

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "style: reformat code with Black"
          git push origin HEAD:${{ github.ref_name }} || echo "No changes to push"  

      - name: Check PEP 8
        run: pycodestyle --exclude=venv,.venv . --count
