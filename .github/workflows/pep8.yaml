
name: PEP 8 validation

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  pep8:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pycodestyle
        run: pip install pycodestyle

      - name: Check PEP 8
        run: pycodestyle --exclude=venv,.venv . --count
